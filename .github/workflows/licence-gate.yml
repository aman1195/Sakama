# Sakama is CLOSED-SOURCE. Copyleft contamination is existential.
# Automates the .claude/agents/licence-guard checks. Pattern adapted from Bifrost's dependency-review.
name: Licence gate

on:
  pull_request:
  push: {branches: [main]}

permissions:
  contents: read

jobs:
  dependency-review:
    # GPL/AGPL deps and known vulns fail the PR outright.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          deny-licenses: GPL-1.0-or-later, GPL-2.0-or-later, GPL-3.0-or-later, AGPL-1.0-or-later, AGPL-3.0-or-later, SSPL-1.0
          fail-on-severity: high
          comment-summary-in-pr: always

  forbidden-sources:
    # Guards against copying from the copyleft apps we studied, and the known licence traps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No copyleft app code, no licence traps
        run: |
          set -e
          fail=0
          # Code lifted from copyleft apps (we may READ these; never COPY).
          if grep -rniE "opennutritracker|com\.opennutritracker|wger|foodyou|waistline" \
               --include='*.dart' --include='*.kt' --include='*.swift' --include='*.yaml' . 2>/dev/null; then
            echo "::error::Reference to a COPYLEFT app (GPL/AGPL). These may be read for understanding, never copied."; fail=1
          fi
          # Best-Flutter-UI-Templates looks MIT but is NOT (grant deletes "sell").
          if grep -rniE "Best-Flutter-UI-Templates|best_flutter_ui" . --exclude-dir=.git --exclude-dir=.github 2>/dev/null; then
            echo "::error::Best-Flutter-UI-Templates is NOT MIT. Unsafe for a commercial product."; fail=1
          fi
          # LiteLLM is MIT EXCEPT enterprise/ — never vendor that directory.
          if [ -d ai-gateway/enterprise ]; then
            echo "::error::LiteLLM enterprise/ is proprietary. Never vendor it."; fail=1
          fi
          # IFCT 2017: NIN forbids electronic reproduction for a product without written permission.
          if grep -rniE "ifct[-_ ]?2017" --include='*.csv' --include='*.json' --include='*.sql' . 2>/dev/null; then
            echo "::error::IFCT 2017 data detected. NIN forbids this without WRITTEN permission. Use INDB (CC BY) + USDA (CC0)."; fail=1
          fi
          [ $fail -eq 0 ] && echo "✅ no copyleft / licence-trap violations"
          exit $fail

  odbl-containment:
    # Open Food Facts is ODbL. Share-alike attaches to DERIVED DATABASES.
    # OFF rows must stay in their own source-tagged table, never merged into the proprietary one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OFF data must stay segregated
        run: |
          set -e
          if [ -d supabase/migrations ] && ls supabase/migrations/*.sql >/dev/null 2>&1; then
            if grep -rniE "insert into (foods|indian_foods)[^;]*openfoodfacts|openfoodfacts[^;]*into foods" supabase/migrations/ 2>/dev/null; then
              echo "::error::Open Food Facts (ODbL) data is being merged into the proprietary food table. This risks share-alike on our whole DB. Keep OFF in its own source-tagged table."
              exit 1
            fi
          fi
          echo "✅ no OFF/proprietary table merge detected"
