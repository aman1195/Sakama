# Sakama is CLOSED-SOURCE. Copyleft contamination is existential.
# Automates the checks in .claude/agents/licence-guard.md.
#
# NOTE: we deliberately do NOT use actions/dependency-review-action here.
# It requires GitHub Advanced Security, a PAID add-on for private repos
# (Bifrost can use it because it is public). We implement the equivalent
# checks ourselves so the gate works on a private repo at zero cost.
name: Licence gate

on:
  pull_request:
  push: {branches: [main]}

permissions:
  contents: read

jobs:
  forbidden-sources:
    # Guards against COPYING from the copyleft apps we studied, and the known traps.
    # Scans CODE and CONFIG only — *.md is excluded on purpose, because our own docs
    # legitimately name these projects in order to FORBID them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No copyleft app code, no licence traps
        run: |
          set +e
          fail=0
          # *.ts, *.py and *.sql are NOT optional. Supabase Edge Functions are
          # TypeScript and the seed pipeline is Python/SQL — respectively where the
          # BYOK keys and the LLM proxy call live (CLAUDE.md rule 3), and where OFF
          # and IFCT data enters (rules 5 and 6). Without them the two highest-risk
          # directories in the repo were the two this gate could not see.
          CODE=(--include=*.dart --include=*.kt --include=*.swift --include=*.java
                --include=*.ts --include=*.js --include=*.py --include=*.sql
                --include=*.yaml --include=*.yml --include=*.json --include=*.gradle
                --include=Podfile --include=pubspec.yaml)
          EXCL=(--exclude-dir=.git --exclude-dir=.github --exclude-dir=.agents
                --exclude-dir=.claude --exclude-dir=.kiro)

          # 1. Code lifted from copyleft apps. We may READ these; never COPY.
          if grep -rniE "opennutritracker|com\.opennutritracker|\bwger\b|foodyou|waistline" "${CODE[@]}" "${EXCL[@]}" . ; then
            echo "::error::Copyleft app (GPL/AGPL) referenced in code/config. These may be read for domain understanding, NEVER copied — copying would force us to open-source all of Sakama."
            fail=1
          fi

          # 2. Best-Flutter-UI-Templates looks MIT but is NOT (its grant deletes "sell").
          if grep -rniE "best-flutter-ui-templates|best_flutter_ui" "${CODE[@]}" "${EXCL[@]}" . ; then
            echo "::error::Best-Flutter-UI-Templates is NOT MIT — unsafe for a commercial product."
            fail=1
          fi

          # 3. LiteLLM is MIT EXCEPT enterprise/ (proprietary). Never vendor it.
          if [ -d ai-gateway/enterprise ]; then
            echo "::error::LiteLLM enterprise/ is proprietary. Never vendor it."
            fail=1
          fi

          # 4. IFCT 2017 — NIN forbids electronic reproduction for a product without
          #    written permission. Use USDA (CC0) for the generic base; Indian dishes
          #    via AI estimation + a commercial licence. NOT INDB (unlicensed +
          #    IFCT-derived — see CLAUDE.md rule 6 / docs/research/base-decision.md).
          if grep -rniE "ifct[-_ ]?2017" --include=*.csv --include=*.sql --include=*.dart \
               --include=*.py --include=*.ts --include=*.json "${EXCL[@]}" . ; then
            echo "::error::IFCT 2017 data detected in code/data. NIN forbids this without WRITTEN permission."
            fail=1
          fi

          if [ $fail -eq 0 ]; then echo "✅ no copyleft / licence-trap violations in code or config"; fi
          exit $fail

  dependency-licences:
    # Real transitive licence scan (the pre-M0 tripwire version of this job failed
    # loudly once app/pubspec.yaml existed — this is the implementation it demanded).
    # Free replacement for dependency-review, which needs GitHub Advanced Security.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Transitive licence scan (very_good_cli over pubspec.lock)
        working-directory: app
        run: |
          set -e
          flutter pub get
          dart pub global activate very_good_cli
          # Allowlist = permissive classes ONLY (CLAUDE.md rule 4). Exceptions are scoped
          # to the EXACT package via --skip-packages so a future dep with the same licence
          # class still trips the gate (review 2026-07-17):
          #  - gtk (MPL-2.0): Linux-desktop-only plugin — never compiles into our
          #    iOS/Android binaries; MPL file-level copyleft permits unmodified use.
          #  - sqlcipher_flutter_libs (Pixar + BSD-3-Clause-HP): SPDX-recognized
          #    permissive Apache/BSD variants, pulled by powersync.
          # direct-dev included: a GPL code GENERATOR would contaminate generated output.
          dart pub global run very_good_cli:very_good packages check licenses \
            --dependency-type="direct-main,direct-dev,transitive" \
            --skip-packages="gtk,sqlcipher_flutter_libs" \
            --allowed="MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,CC0-1.0,Zlib,BSL-1.0,Unicode-DFS-2016,Unicode-3.0"

  odbl-containment:
    # Open Food Facts is ODbL. Share-alike attaches to DERIVED DATABASES.
    # OFF rows must live in their own source-tagged table, never merged into the
    # proprietary Indian food table. This is the biggest legal risk in the stack.
    #
    # The previous check was line-based grep, so it could not see a normally
    # formatted migration:
    #
    #     insert into foods (name, kcal, source, licence)
    #     select name, kcal, 'openfoodfacts', 'ODbL'
    #     from off_staging;
    #
    # `[^;]*` cannot span a newline, so every multi-line INSERT ... SELECT — that
    # is, every realistic seed migration — passed green. It also only scanned
    # supabase/migrations/*.sql, so a Python or TypeScript seed pipeline doing the
    # same merge was never scanned at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Open Food Facts data must stay segregated
        run: |
          python3 - <<'PY'
          import os, re, sys

          # Statement-level, not line-level: strip comments, then split on ';'.
          PROPRIETARY = r'(foods|indian_foods|indian_food)'
          WRITE = re.compile(
              r'\b(insert\s+into|copy|merge\s+into|update)\s+' + PROPRIETARY + r'\b', re.I)
          OFF = re.compile(r"openfoodfacts|open_food_facts|off_(staging|foods|raw)|\bodbl\b", re.I)

          SCAN_EXT = ('.sql', '.py', '.ts', '.js', '.dart')
          SKIP_DIRS = {'.git', '.github', '.agents', '.claude', 'node_modules'}

          hits = []
          for dp, dn, fn in os.walk('.'):
              if SKIP_DIRS & set(dp.split(os.sep)):
                  dn[:] = []
                  continue
              for f in fn:
                  if not f.endswith(SCAN_EXT):
                      continue
                  p = os.path.join(dp, f)
                  try:
                      body = open(p, encoding='utf-8', errors='ignore').read()
                  except OSError:
                      continue
                  body = re.sub(r'--[^\n]*|/\*.*?\*/|#[^\n]*', ' ', body, flags=re.S)
                  for stmt in body.split(';'):
                      if WRITE.search(stmt) and OFF.search(stmt):
                          one = ' '.join(stmt.split())[:160]
                          hits.append(f"{p}: {one}")

          for h in hits:
              print(f"::error::ODbL contamination: {h}")
          if hits:
              print("Open Food Facts (ODbL) data is being written into the proprietary food table.")
              print("Share-alike would attach to our whole database. Keep OFF rows in a separate,")
              print("source-tagged table. See CLAUDE.md rule 5 and docs/architecture/03-food-database.md.")
              sys.exit(1)
          print("✅ no OFF / proprietary-table merge detected")
          PY
