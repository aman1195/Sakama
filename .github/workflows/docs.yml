# We hand-found 20 broken links once. Never again. (Pattern from Bifrost's docs-validation.)
name: Docs

on:
  pull_request: {paths: ['**.md']}
  push: {branches: [main], paths: ['**.md']}

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate internal markdown links
        run: |
          python3 - <<'PY'
          import os, re, sys
          bad = []
          for dp, dn, fn in os.walk('.'):
              if any(x in dp for x in ['.git', '.agents', '.claude/skills', 'node_modules']):
                  continue
              for f in fn:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(dp, f)
                  for link in re.findall(r'\]\(([^)#][^)]*)\)', open(p, encoding='utf-8').read()):
                      if link.startswith(('http', 'mailto', '<')):
                          continue
                      t = os.path.normpath(os.path.join(dp, link.split('#')[0]))
                      if not os.path.exists(t):
                          bad.append(f"{p} -> {link}")
          for b in bad:
              print(f"::error::broken link: {b}")
          print(f"{len(bad)} broken links" if bad else "✅ all internal links resolve")
          sys.exit(1 if bad else 0)
          PY
