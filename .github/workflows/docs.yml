# We hand-found 20 broken links once. Never again. (Pattern from Bifrost's docs-validation.)
#
# NOT path-filtered, deliberately. `links` is a REQUIRED status check, and a
# required check on a path-filtered workflow is a deadlock: GitHub waits forever
# for a context that never reports. The first Flutter-only PR of M0 (touching no
# .md at all) would have hung with a dead merge button and no way to clear it.
name: Docs

on:
  pull_request:
  push: {branches: [main]}

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate internal markdown links
        run: |
          python3 - <<'PY'
          import os, re, sys

          # Compare path COMPONENTS, not substrings. `'.git' in './.github'` is
          # True, so the old substring test silently skipped the entire .github
          # tree — including the PR template, which links to docs/DESIGN.md and
          # docs/MOBILE.md. The check that exists to catch a moved file was blind
          # to the file most likely to link at one.
          SKIP_DIRS = {'.git', '.agents', 'node_modules'}
          SKIP_TREES = {os.path.join('.claude', 'skills')}

          bad = []
          for dp, dn, fn in os.walk('.'):
              if SKIP_DIRS & set(dp.split(os.sep)) or any(s in dp for s in SKIP_TREES):
                  dn[:] = []
                  continue
              for f in fn:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(dp, f)
                  with open(p, encoding='utf-8') as fh:
                      body = fh.read()
                  for link in re.findall(r'\]\(([^)#][^)]*)\)', body):
                      if link.startswith(('http', 'mailto', '<')):
                          continue
                      t = os.path.normpath(os.path.join(dp, link.split('#')[0]))
                      if not os.path.exists(t):
                          bad.append(f"{p} -> {link}")
          for b in bad:
              print(f"::error::broken link: {b}")
          print(f"{len(bad)} broken links" if bad else "✅ all internal links resolve")
          sys.exit(1 if bad else 0)
          PY
