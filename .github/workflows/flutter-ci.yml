name: Flutter CI

# No path filter: if this ever becomes a required check, a filtered job would
# never report on non-app PRs and deadlock the merge (the gates' #1 bug class).
on:
  pull_request:
  push: {branches: [main]}

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Codegen (envied needs an env file; CI uses the committed example)
        working-directory: app
        run: |
          cp .env.example .env
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze (dart, not flutter — ONLY dart analyze loads the native
              analyzer plugins, i.e. riverpod_lint; verified by probe. --fatal-infos
              because plugin rules emit warnings, which exit 0 by default)
        working-directory: app
        # EXPLICIT PATHS, not no-arg: since mobile_scanner entered the tree
        # (M2.3b), the no-arg `dart analyze` HANGS indefinitely — the
        # riverpod_lint native plugin pathologically stalls on the whole-package
        # context the larger dependency graph produces (reproduced locally +
        # on CI with a watchdog). Naming the source dirs bounds the context and
        # completes in seconds with the SAME coverage (these are the only Dart
        # source dirs) and the SAME plugin loaded. If a new top-level Dart source
        # dir is added, add it here.
        run: dart analyze --fatal-infos lib test integration_test
      - name: Tests (includes test/migration — mandatory per docs/MOBILE.md)
        working-directory: app
        run: flutter test

  # The Edge Functions had NO automated coverage until #107: `deno check` was
  # only ever run by hand, and a hand-run check is one someone forgets. These
  # functions hold the AI budget enforcement, the key handling (rule 3), and
  # the silent-model-swap guard — the last of which shipped failing OPEN
  # precisely because nothing tested it.
  #
  # No path filter, for the reason given at the top of this file.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - name: Type-check every function
        run: deno check supabase/functions/*/index.ts supabase/functions/_shared/*.ts
      - name: Unit tests
        run: deno test supabase/functions/_shared/
