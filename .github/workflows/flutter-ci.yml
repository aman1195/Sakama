name: Flutter CI

on:
  pull_request: {paths: ['app/**', '.github/workflows/flutter-ci.yml']}
  push: {branches: [main], paths: ['app/**']}

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: app
        run: flutter pub get
      - name: Codegen (envied needs an env file; CI uses the committed example)
        working-directory: app
        run: |
          cp .env.example .env
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Tests (includes test/migration — mandatory per docs/MOBILE.md)
        working-directory: app
        run: flutter test
