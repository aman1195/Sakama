# commit-message.prefix is load-bearing, not cosmetic. Without it Dependabot
# titles its PRs "Bump X from 1 to 2", which fails the conventional-commit check
# in pr-hygiene.yml — a REQUIRED status check — so every dependency PR is
# unmergeable. With `chore`, it opens "chore(deps): bump X from 1 to 2", which is
# already conventional. (The branch prefix `dependabot/...` cannot be configured
# at all; pr-hygiene.yml exempts the actor from the branch check instead.)
version: 2
updates:
  - package-ecosystem: "pub"          # Flutter/Dart — active from M0
    directory: "/app"
    schedule: {interval: "weekly"}
    open-pull-requests-limit: 5
    commit-message: {prefix: "chore", include: "scope"}
    labels: ["dependencies", "needs-licence-check"]
    # Some Dart packages ship a runtime + a codegen sibling that share private
    # APIs and MUST move in lockstep. Bumping one alone breaks codegen/tests
    # (PR #29: `drift` 2.34.2 with `drift_dev` 2.34.0 → the migration harness
    # failed to compile). Group each family so Dependabot bumps them together.
    # update-types on every group: MAJORS OPEN AS THEIR OWN PR, never inside a
    # group. Learned the hard way (#111, 2026-08-24): the "riverpod group" PR
    # carried freezed ^3 -> ^4 as an unadvertised member and the major was
    # merged on CI-greenness — hours after the same major was deliberately
    # declined in #112. A group title must never hide a major again. (A major
    # can still ride in as a transitive requirement of a grouped bump; that
    # residual case is why group PRs get their members read in review.)
    groups:
      drift:
        patterns: ["drift", "drift_dev", "drift_flutter", "drift_sqlite_async"]
        update-types: ["minor", "patch"]
      riverpod:
        patterns: ["riverpod", "flutter_riverpod", "riverpod_annotation",
                   "riverpod_generator", "riverpod_lint"]
        update-types: ["minor", "patch"]
      freezed:
        patterns: ["freezed", "freezed_annotation"]
        update-types: ["minor", "patch"]
      envied:
        patterns: ["envied", "envied_generator"]
        update-types: ["minor", "patch"]
    # The drift pin + ignore that lived here (PRs #34/#84: analyzer ^13 bind)
    # was REMOVED 2026-08-24, per its own stated removal condition: freezed 4 +
    # riverpod_generator 4 moved the stack to analyzer 13.3.0, drift 2.34.3
    # resolves, and the migration harness compiles and passes against it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly"}
    commit-message: {prefix: "chore", include: "scope"}
    labels: ["dependencies"]
