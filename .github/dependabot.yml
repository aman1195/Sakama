# commit-message.prefix is load-bearing, not cosmetic. Without it Dependabot
# titles its PRs "Bump X from 1 to 2", which fails the conventional-commit check
# in pr-hygiene.yml — a REQUIRED status check — so every dependency PR is
# unmergeable. With `chore`, it opens "chore(deps): bump X from 1 to 2", which is
# already conventional. (The branch prefix `dependabot/...` cannot be configured
# at all; pr-hygiene.yml exempts the actor from the branch check instead.)
version: 2
updates:
  - package-ecosystem: "pub"          # Flutter/Dart — active from M0
    directory: "/app"
    schedule: {interval: "weekly"}
    open-pull-requests-limit: 5
    commit-message: {prefix: "chore", include: "scope"}
    labels: ["dependencies", "needs-licence-check"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly"}
    commit-message: {prefix: "chore", include: "scope"}
    labels: ["dependencies"]
