# PowerSync sync rules for Sakama — paste into the PowerSync dashboard
# (Instance -> Sync Rules) or deploy via its API.
#
# One bucket per user: each device receives ONLY its own user's rows
# (defence-in-depth on top of Postgres RLS, which remains the primary boundary).
# request.user_id() is the Supabase auth.uid() carried in the PowerSync JWT.
bucket_definitions:
  user_data:
    parameters: select request.user_id() as user_id
    data:
      - select * from food_logs where user_id = bucket.user_id
