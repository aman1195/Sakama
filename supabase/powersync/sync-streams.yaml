# PowerSync SYNC STREAMS for Sakama — paste into the dashboard's Sync Streams
# editor (the current format; replaced the legacy bucket_definitions sync rules
# our earlier sync-rules.yaml used).
#
# Per-user scoping: auth.user_id() is the Supabase auth.uid() carried in the
# PowerSync JWT — each client syncs ONLY its own rows (defence-in-depth on top
# of Postgres RLS, which stays the primary boundary for the REST path).
#
# auto_subscribe is LOAD-BEARING: our SupabaseConnector never calls a
# subscribe API, so every stream here must sync by default on connect.
config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    query: SELECT * FROM food_logs WHERE user_id = auth.user_id()

  user_profile:
    auto_subscribe: true
    query: SELECT * FROM profiles WHERE user_id = auth.user_id()

  user_water:
    auto_subscribe: true
    query: SELECT * FROM water_logs WHERE user_id = auth.user_id()

  user_weight:
    auto_subscribe: true
    query: SELECT * FROM weight_logs WHERE user_id = auth.user_id()

  user_plans:
    auto_subscribe: true
    query: SELECT * FROM user_plans WHERE user_id = auth.user_id()

  user_foods:
    auto_subscribe: true
    query: SELECT * FROM user_foods WHERE user_id = auth.user_id()

  user_workouts:
    auto_subscribe: true
    query: SELECT * FROM workouts WHERE user_id = auth.user_id()

  user_meals:
    auto_subscribe: true
    query: SELECT * FROM meals WHERE user_id = auth.user_id()

  user_target_history:
    auto_subscribe: true
    query: SELECT * FROM target_history WHERE user_id = auth.user_id()
